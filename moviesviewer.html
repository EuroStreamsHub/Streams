<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STREAM HUB | Watch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --red: #e50914;
    --gold: #f5c518;
    --bg: #080808;
    --surface: #111;
    --surface2: #161616;
    --border: rgba(255,255,255,0.07);
    --text: #fff;
    --muted: #555;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ─────────────────────────
     NAVIGATION
  ───────────────────────── */

  nav {
    width: 100%;
    padding: 1rem 4%;
    display: flex;
    align-items: center;
    gap: 16px;

    border-bottom: 1px solid var(--border);
    background: rgba(8,8,8,0.96);

    position: sticky;
    top: 0;
    z-index: 100;

    backdrop-filter: blur(12px);
  }

  .back {
    text-decoration: none;
    color: var(--text);

    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);

    padding: 7px 14px;
    border-radius: 4px;

    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;

    transition: background 0.2s;
  }

  .back:hover {
    background: rgba(255,255,255,0.12);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 3px;
  }

  .logo span {
    color: var(--red);
  }

  /* ─────────────────────────
     TITLE
  ───────────────────────── */

  .title-wrap {
    width: 95%;
    max-width: 1100px;
    padding: 1.5rem 0 1rem;
    text-align: center;
  }

  .content-label {
    font-size: 0.65rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    letter-spacing: 2px;
    line-height: 1;
  }

  /* ─────────────────────────
     VIDEO PLAYER
  ───────────────────────── */

  .player-wrap {
    width: 95%;
    max-width: 1100px;

    background: #000;

    border: 1px solid var(--border);
    border-radius: 4px;

    overflow: hidden;

    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .aspect {
    position: relative;
    aspect-ratio: 16 / 9;
  }

  iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: none;
  }

  /* ─────────────────────────
     LOADER
  ───────────────────────── */

  .loader {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    z-index: 2;

    pointer-events: none;
  }

  .spinner {
    width: 40px;
    height: 40px;

    border: 2px solid rgba(255,255,255,0.06);
    border-top-color: var(--red);

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ─────────────────────────
     SERIES CONTROLS
  ───────────────────────── */

  .series-section {
    width: 95%;
    max-width: 1100px;

    margin: 1.2rem 0 3rem;
  }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-bottom: 1rem;

    flex-wrap: wrap;
  }

  .controls-label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;

    color: var(--muted);
  }

  select#seasonSelect {
    background: var(--surface);

    border: 1px solid var(--border);

    color: #fff;

    padding: 8px 14px;

    border-radius: 4px;

    font-family: 'DM Sans', sans-serif;

    font-size: 0.8rem;
    font-weight: 700;

    letter-spacing: 1px;
    text-transform: uppercase;

    cursor: pointer;

    outline: none;

    transition: border-color 0.2s;
  }

  select#seasonSelect:focus {
    border-color: var(--red);
  }

  select#seasonSelect option {
    background: #111;
  }

  /* ─────────────────────────
     EPISODES
  ───────────────────────── */

  .ep-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .ep-btn {
    background: var(--surface);

    border: 1px solid var(--border);

    color: var(--muted);

    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 4px;

    cursor: pointer;

    font-family: 'DM Sans', sans-serif;

    font-size: 0.8rem;
    font-weight: 700;

    transition: all 0.2s;
  }

  .ep-btn:hover {
    color: #fff;

    border-color: rgba(255,255,255,0.2);

    background: var(--surface2);
  }

  .ep-btn.active {
    background: var(--red);

    border-color: var(--red);

    color: #fff;
  }

  /* ─────────────────────────
     MOBILE
  ───────────────────────── */

  @media (max-width: 600px) {

    nav {
      padding: 0.8rem 3%;
    }

    .title-wrap {
      padding-top: 1.2rem;
    }

    .player-wrap {
      width: 100%;
      border-left: 0;
      border-right: 0;
      border-radius: 0;
    }

    .series-section {
      width: 94%;
    }

    .ep-btn {
      width: 42px;
      height: 42px;
    }
  }
</style>
</head>

<body>

<!-- ─────────────────────────
     NAVIGATION
───────────────────────── -->

<nav>

  <a class="back" href="movies.html">
    ← Back
  </a>

  <div class="logo">
    STREAM<span>HUB</span>
  </div>

</nav>


<!-- ─────────────────────────
     TITLE
───────────────────────── -->

<div class="title-wrap">

  <div class="content-label" id="contentLabel">
    Film
  </div>

  <h1 id="title">
    Loading…
  </h1>

</div>


<!-- ─────────────────────────
     PLAYER
───────────────────────── -->

<div class="player-wrap">

  <div class="aspect">

    <div class="loader" id="loader">
      <div class="spinner"></div>
    </div>

    <iframe
      id="player"
      width="100%"
      height="100%"
      frameborder="0"
      allowfullscreen
      allow="autoplay; encrypted-media">
    </iframe>

  </div>

</div>


<!-- ─────────────────────────
     TV CONTROLS
───────────────────────── -->

<div
  class="series-section"
  id="seriesSection"
  style="display:none;"
>

  <div class="controls-row">

    <span class="controls-label">
      Season
    </span>

    <select
      id="seasonSelect"
      onchange="loadEpisodes()"
    ></select>

  </div>

  <div
    class="ep-grid"
    id="epGrid"
  ></div>

</div>


<script>

  /* ─────────────────────────
     CONFIG
  ───────────────────────── */

  const TMDB_KEY =
    "12955008668c12c07496b04132f9ce44";

  const VIDFAST =
    "https://vidfast.vc";

  const THEME =
    "16A085";


  /* ─────────────────────────
     URL PARAMETERS
  ───────────────────────── */

  const params =
    new URLSearchParams(location.search);

  const type =
    params.get("type");

  const id =
    params.get("id");

  const imdb =
    params.get("imdb");

  const title =
    params.get("title") || "Now Playing";


  /* ─────────────────────────
     ELEMENTS
  ───────────────────────── */

  const player =
    document.getElementById("player");

  const loader =
    document.getElementById("loader");

  const titleElement =
    document.getElementById("title");

  const contentLabel =
    document.getElementById("contentLabel");

  const seriesSection =
    document.getElementById("seriesSection");

  const seasonSelect =
    document.getElementById("seasonSelect");

  const epGrid =
    document.getElementById("epGrid");


  /* ─────────────────────────
     PAGE TITLE
  ───────────────────────── */

  titleElement.textContent =
    title;

  contentLabel.textContent =
    type === "tv"
      ? "Series"
      : "Film";


  /* ─────────────────────────
     PLAYER LOAD
  ───────────────────────── */

  player.onload = () => {

    loader.style.display =
      "none";

  };


  /* ─────────────────────────
     BUILD MOVIE URL
  ───────────────────────── */

  function getMovieURL() {

    const query =
      new URLSearchParams({

        autoPlay: "true",
        title: "true",
        poster: "true",
        theme: THEME

      });

    return `${VIDFAST}/movie/${encodeURIComponent(imdb)}?${query}`;

  }


  /* ─────────────────────────
     BUILD TV URL
  ───────────────────────── */

  function getTVURL(season, episode) {

    const query =
      new URLSearchParams({

        autoPlay: "true",
        title: "true",
        poster: "true",
        theme: THEME,
        nextButton: "true",
        autoNext: "true"

      });

    return `${VIDFAST}/tv/${encodeURIComponent(id)}/${season}/${episode}?${query}`;

  }


  /* ─────────────────────────
     LOAD MOVIE
  ───────────────────────── */

  function loadMovie() {

    loader.style.display =
      "flex";

    player.src =
      getMovieURL();

  }


  /* ─────────────────────────
     INITIALISE PAGE
  ───────────────────────── */

  async function init() {

    try {

      if (type === "tv") {

        await initTV();

      } else {

        loadMovie();

      }

    } catch (error) {

      console.error(
        "Failed to initialise player:",
        error
      );

      loader.style.display =
        "none";

    }

  }


  /* ─────────────────────────
     INITIALISE TV
  ───────────────────────── */

  async function initTV() {

    seriesSection.style.display =
      "block";


    const response =
      await fetch(
        `https://api.themoviedb.org/3/tv/${encodeURIComponent(id)}?api_key=${TMDB_KEY}`
      );


    if (!response.ok) {

      throw new Error(
        "Unable to load TV information."
      );

    }


    const data =
      await response.json();


    seasonSelect.innerHTML =
      "";


    data.seasons.forEach(
      season => {

        if (
          season.season_number < 1
        ) {
          return;
        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          season.season_number;


        option.textContent =
          `Season ${season.season_number}`;


        seasonSelect.appendChild(
          option
        );

      }
    );


    await loadEpisodes();

  }


  /* ─────────────────────────
     LOAD EPISODES
  ───────────────────────── */

  async function loadEpisodes() {

    const season =
      seasonSelect.value;


    if (!season) {
      return;
    }


    loader.style.display =
      "flex";


    epGrid.innerHTML =
      "";


    try {

      const response =
        await fetch(
          `https://api.themoviedb.org/3/tv/${encodeURIComponent(id)}/season/${encodeURIComponent(season)}?api_key=${TMDB_KEY}`
        );


      if (!response.ok) {

        throw new Error(
          "Unable to load episodes."
        );

      }


      const data =
        await response.json();


      data.episodes.forEach(
        episode => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "ep-btn";


          button.textContent =
            episode.episode_number;


          button.title =
            episode.name ||
            `Episode ${episode.episode_number}`;


          button.onclick =
            () => {

              playEpisode(
                season,
                episode.episode_number,
                button
              );

            };


          epGrid.appendChild(
            button
          );

        }
      );


      /* Automatically play episode 1 */

      if (epGrid.firstElementChild) {

        epGrid
          .firstElementChild
          .click();

      } else {

        loader.style.display =
          "none";

      }

    } catch (error) {

      console.error(
        "Failed to load episodes:",
        error
      );

      loader.style.display =
        "none";

    }

  }


  /* ─────────────────────────
     PLAY EPISODE
  ───────────────────────── */

  function playEpisode(
    season,
    episode,
    button
  ) {

    document
      .querySelectorAll(".ep-btn")
      .forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );


    button.classList.add(
      "active"
    );


    loader.style.display =
      "flex";


    player.src =
      getTVURL(
        season,
        episode
      );

  }


  /* ─────────────────────────
     START
  ───────────────────────── */

  init();

</script>

</body>
</html>
