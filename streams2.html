<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORT HUB | Football Streams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --blue: #0072db;
    --red: #e50914;
    --amber: #f59e0b;
    --green: #22c55e;
    --bg: #080808;
    --surface: #111;
    --surface2: #161616;
    --border: rgba(255,255,255,0.07);
    --text: #fff;
    --muted: #555;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    min-height: 64px;
    background: rgba(8,8,8,0.96);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 10px 4%;
    gap: 16px;
  }

  .back {
    color: var(--text);
    text-decoration: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .back:hover {
    background: rgba(255,255,255,0.12);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 3px;
    color: #fff;
    flex-shrink: 0;
  }

  .logo span {
    color: var(--blue);
  }

  .search-wrap {
    flex: 1;
    max-width: 380px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  input#search {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 9px 12px 9px 38px;
    border-radius: 4px;
    color: #fff;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    transition: border-color 0.2s, background 0.2s;
  }

  input#search:focus {
    border-color: var(--blue);
    background: rgba(0,114,219,0.08);
  }

  input#search::placeholder {
    color: var(--muted);
  }

  /* ── FILTERS ── */
  .filters {
    display: flex;
    gap: 8px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .filter-btn {
    padding: 7px 16px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .filter-btn:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }

  .filter-btn.live-active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .filter-btn.soon-active {
    background: var(--amber);
    border-color: var(--amber);
    color: #000;
  }

  /* ── MAIN ── */
  main {
    padding-top: 64px;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 1rem 4%;
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats-bar strong {
    color: #fff;
    font-size: 0.9rem;
  }

  #liveCount {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--green);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse-dot 1.5s infinite;
  }

  @keyframes pulse-dot {
    0%,100% {
      box-shadow: 0 0 0 0 rgba(34,197,94,0.5);
    }

    50% {
      box-shadow: 0 0 0 5px rgba(34,197,94,0);
    }
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--border);
    padding-bottom: 4rem;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeIn 0.4s forwards;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    background: var(--surface2);
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.2s;
    z-index: 2;
  }

  .card.is-live::before {
    background: var(--red);
  }

  .card.is-soon::before {
    background: var(--amber);
  }

  .card:not(.is-live):not(.is-soon)::before {
    background: var(--muted);
    opacity: 0.3;
  }

  .card-poster-wrap {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--surface2);
    overflow: hidden;
  }

  .card-poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-body {
    padding: 1.4rem 1.6rem;
  }

  .card-teams {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 1px;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 0.7rem;
  }

  .card-vs {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 6px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 2px;
    font-weight: 700;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .badge-live {
    background: rgba(229,9,20,0.15);
    color: var(--red);
    border: 1px solid rgba(229,9,20,0.3);
  }

  .badge-live-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse-red 1.2s infinite;
  }

  @keyframes pulse-red {
    0%,100% {
      opacity: 1;
    }

    50% {
      opacity: 0.3;
    }
  }

  .badge-soon {
    background: rgba(245,158,11,0.12);
    color: var(--amber);
    border: 1px solid rgba(245,158,11,0.25);
  }

  .badge-upcoming {
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .card-time {
    color: var(--muted);
    font-size: 0.72rem;
  }

  /* ── LOADER / EMPTY ── */
  .state-msg {
    grid-column: 1/-1;
    padding: 5rem 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(255,255,255,0.06);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── PLAYER VIEW ── */
  .player-top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 1rem 4%;
    border-bottom: 1px solid var(--border);
  }

  .player-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 1px;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-wrap {
    width: 92%;
    max-width: 1100px;
    margin: 1.5rem auto 0;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .aspect {
    position: relative;
    aspect-ratio: 16/9;
  }

  .aspect iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 2;
  }

  .loader .spinner {
    margin: 0;
  }

  .channels-wrap {
    width: 92%;
    max-width: 1100px;
    margin: 1.2rem auto 3rem;
  }

  .channels-label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.8rem;
  }

  .channels-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ch-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .ch-btn:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.2);
    background: var(--surface2);
  }

  .ch-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }

  .no-sources {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 1rem 4%;
    letter-spacing: 1px;
  }

  /* ── MOBILE ── */
  @media (max-width: 700px) {

    header {
      min-height: 110px;
      height: auto;
      flex-wrap: wrap;
      padding: 10px 4%;
      gap: 10px;
    }

    /* FIRST ROW:
       Back + SPORT HUB + Live + Soon
    */

    .back {
      padding: 7px 10px;
      font-size: 0.7rem;
    }

    .logo {
      font-size: 1.3rem;
    }

    .filters {
      margin-left: auto;
      gap: 5px;
    }

    .filter-btn {
      padding: 7px 10px;
      font-size: 0.68rem;
    }

    /* SECOND ROW:
       Search only
    */

    .search-wrap {
      order: 10;
      flex-basis: 100%;
      width: 100%;
      max-width: none;
    }

    main {
      padding-top: 110px;
    }

    .stats-bar {
      gap: 14px;
      flex-wrap: wrap;
    }

    .grid {
      grid-template-columns: 1fr;
    }
  }

</style>
</head>

<body>

<header>

  <a class="back" href="index.html">
    ← Back
  </a>

  <div class="logo">
    SPORT<span>HUB</span>
  </div>

  <div class="search-wrap">

    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5">

      <circle cx="11" cy="11" r="8"/>

      <line
        x1="21"
        y1="21"
        x2="16.65"
        y2="16.65"/>

    </svg>

    <input
      id="search"
      placeholder="Search teams or competitions…">

  </div>

  <div class="filters">

    <button
      class="filter-btn"
      id="btnLive">
      ● Live
    </button>

    <button
      class="filter-btn"
      id="btnSoon">
      ⏱ Soon
    </button>

  </div>

</header>


<main>

  <div id="listView">

    <div class="stats-bar">

      <div id="liveCount">

        <span class="live-dot"></span>

        <strong id="liveNum">0</strong>

        &nbsp;live now

      </div>

      <div>

        <strong id="totalNum">0</strong>

        &nbsp;matches

      </div>

      <div
        id="lastUpdate"
        style="margin-left:auto;">

        Loading…

      </div>

    </div>


    <div
      class="grid"
      id="grid">

      <div class="state-msg">

        <div class="spinner"></div>

        Loading matches…

      </div>

    </div>

  </div>


  <section
    id="playerView"
    style="display:none;">

    <div class="player-top">

      <button
        class="back"
        id="backBtn"
        type="button">
        ← Back
      </button>

      <div
        class="player-title"
        id="playerTitle">
      </div>

    </div>

    <div class="player-wrap">

      <div class="aspect">

        <div
          class="loader"
          id="loader">

          <div class="spinner"></div>

        </div>

        <iframe
          id="player"
          allowfullscreen>
        </iframe>

      </div>

    </div>

    <div class="channels-wrap">

      <div class="channels-label">
        Channels
      </div>

      <div
        class="channels-grid"
        id="mirrorGrid">
      </div>

    </div>

  </section>

</main>


<script>

const API = "https://api.ppv.st/api/streams";

let matches = [];
let mode = "all";

const NOW = () => Math.floor(Date.now() / 1000);


/* ── FLATTEN ── */

function flattenStreams(categories) {

  const result = [];

  for (const category of categories || []) {
    for (const stream of category.streams || []) {
      result.push({
        ...stream,
        category_name: stream.category_name || category.category || "Other"
      });
    }
  }

  return result;

}


/* ── SOURCES ── */

function getSources(stream) {

  const sources = [];

  if (stream.iframe) {
    sources.push({
      name: stream.tag || "Stream",
      url: stream.iframe
    });
  }

  for (const sub of stream.substreams || []) {
    if (sub.iframe || sub.url) {
      sources.push({
        name: sub.name || sub.tag || `Stream ${sources.length + 1}`,
        url: sub.iframe || sub.url
      });
    }
  }

  return sources;

}


/* ── LOAD MATCHES ── */

async function loadMatches() {

  try {

    const res =
      await fetch(API, { cache: "no-store" });

    const data =
      await res.json();

    if (!data.success) {
      throw new Error("API returned an unsuccessful response");
    }

    const all =
      flattenStreams(data.streams)
        .filter(
          m => (m.category_name || "")
            .toLowerCase() === "football"
        );

    matches =
      all.filter(
        m => statusOf(m) !== "past"
      );

    document.getElementById('lastUpdate').textContent =
      'Updated ' +
      new Date().toLocaleTimeString(
        [],
        {
          hour: '2-digit',
          minute: '2-digit'
        }
      );

    render();

  } catch(e) {

    document.getElementById('grid').innerHTML =
      '<div class="state-msg">' +
      'Could not load matches. Retrying…' +
      '</div>';

  }

}


/* ── STATUS ── */

function statusOf(m) {

  if (Number(m.always_live) === 1) {
    return "live";
  }

  const now = NOW();
  const start = Number(m.starts_at || 0);
  const end = Number(m.ends_at || 0);

  if (start <= now && end >= now) return "live";
  if (start > now) return "upcoming";
  return "past";

}

const isLive =
  m => statusOf(m) === "live";

const isSoon =
  m =>
    statusOf(m) === "upcoming" &&
    Number(m.starts_at) <= NOW() + 3600;


/* ── ESCAPE ── */

function escapeAttr(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

}


/* ── KICKOFF FORMAT ── */

function formatKickoff(ts) {

  const d = new Date(Number(ts) * 1000);

  return (
    d.toLocaleTimeString(
      [],
      {
        hour: '2-digit',
        minute: '2-digit'
      }
    ) +
    ' · ' +
    d.toLocaleDateString(
      [],
      {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      }
    )
  );

}


/* ── RENDER ── */

function render() {

  const term =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  let list =
    matches.filter(
      m =>
        (m.name || "")
          .toLowerCase()
          .includes(term)
    );

  if (mode === "live") {
    list = list.filter(isLive);
  }

  if (mode === "soon") {
    list = list.filter(isSoon);
  }


  /* Sort live matches first */

  list.sort((a, b) => {

    const aL = isLive(a) ? 0 : 1;
    const bL = isLive(b) ? 0 : 1;

    if (aL !== bL) {
      return aL - bL;
    }

    return Number(a.starts_at || 0) - Number(b.starts_at || 0);

  });


  /* Update statistics */

  const liveCount =
    matches.filter(isLive).length;

  document.getElementById('liveNum')
    .textContent = liveCount;

  document.getElementById('totalNum')
    .textContent = list.length;


  /* Grid */

  const g =
    document.getElementById("grid");

  g.innerHTML = "";


  if (list.length === 0) {

    g.innerHTML =
      '<div class="state-msg">' +
      'No matches found.' +
      '</div>';

    return;

  }


  /* Create match cards */

  list.forEach((m, i) => {

    const live = isLive(m);
    const soon = isSoon(m);

    const card =
      document.createElement("div");

    card.className =
      `card ${
        live
          ? 'is-live'
          : soon
            ? 'is-soon'
            : ''
      }`;

    card.style.animationDelay =
      `${Math.min(i * 0.04, 0.5)}s`;


    /* Split title into teams */

    const name = m.name || "Untitled";

    const parts =
      name.split(' vs ');

    const teamsHTML =
      parts.length === 2
        ? `${parts[0]}<span class="card-vs">vs</span>${parts[1]}`
        : name;


    /* Badge */

    let badge = '';

    if (live) {

      badge =
        `<span class="badge badge-live">
          <span class="badge-live-dot"></span>
          Live
        </span>`;

    } else if (soon) {

      badge =
        `<span class="badge badge-soon">
          Soon
        </span>`;

    } else {

      badge =
        `<span class="badge badge-upcoming">
          Upcoming
        </span>`;

    }


    /* Card HTML */

    const posterHTML =
      m.poster
        ? `<img class="card-poster" src="${escapeAttr(m.poster)}" alt="" loading="lazy">`
        : '';

    card.innerHTML = `
      <div class="card-poster-wrap">
        ${posterHTML}
      </div>

      <div class="card-body">
        <div class="card-teams">
          ${teamsHTML}
        </div>

        <div class="card-meta">
          ${badge}

          <span class="card-time">
            ${m.starts_at ? formatKickoff(m.starts_at) : ''}
          </span>
        </div>
      </div>
    `;


    /* Open the in-page player on click */

    const sources = getSources(m);

    card.onclick = () =>
      openPlayer(name, sources);


    g.appendChild(card);

  });

}


/* ── SEARCH ── */

document.getElementById("search").oninput =
  render;


/* ── LIVE FILTER ── */

document.getElementById("btnLive").onclick =
  function() {

    document
      .querySelectorAll(".filter-btn")
      .forEach(
        b =>
          b.className = 'filter-btn'
      );

    if (mode === 'live') {

      mode = 'all';

      render();

      return;

    }

    mode = 'live';

    this.classList.add('live-active');

    render();

  };


/* ── SOON FILTER ── */

document.getElementById("btnSoon").onclick =
  function() {

    document
      .querySelectorAll(".filter-btn")
      .forEach(
        b =>
          b.className = 'filter-btn'
      );

    if (mode === 'soon') {

      mode = 'all';

      render();

      return;

    }

    mode = 'soon';

    this.classList.add('soon-active');

    render();

  };


/* ── PLAYER VIEW ── */

const listView   = document.getElementById("listView");
const playerView = document.getElementById("playerView");
const playerEl    = document.getElementById("player");
const loaderEl    = document.getElementById("loader");
const mirrorGrid  = document.getElementById("mirrorGrid");
const playerTitle = document.getElementById("playerTitle");

function loadChannel(url, btn) {

  loaderEl.style.display = "flex";
  playerEl.src = url;

  document
    .querySelectorAll(".ch-btn")
    .forEach(b => b.classList.remove("active"));

  if (btn) {
    btn.classList.add("active");
  }

}

playerEl.onload = () => {
  loaderEl.style.display = "none";
};

function openPlayer(title, sources) {

  playerTitle.textContent = title;

  mirrorGrid.innerHTML = "";

  if (sources.length === 0) {

    mirrorGrid.innerHTML =
      '<div class="no-sources">No stream sources available.</div>';

    playerEl.src = "";

  } else {

    sources.forEach((s, i) => {

      const btn = document.createElement("button");

      btn.className = "ch-btn";
      btn.textContent = s.name ? s.name.toUpperCase() : `STREAM ${i + 1}`;
      btn.onclick = () => loadChannel(s.url, btn);

      if (i === 0) {
        btn.classList.add("active");
      }

      mirrorGrid.appendChild(btn);

    });

    loadChannel(sources[0].url, mirrorGrid.firstChild);

  }

  listView.style.display = "none";
  playerView.style.display = "block";

  window.scrollTo({ top: 0, behavior: "instant" });

}

function closePlayer() {

  playerEl.src = "";

  playerView.style.display = "none";
  listView.style.display = "block";

}

document.getElementById("backBtn").onclick =
  closePlayer;


/* ── START ── */

loadMatches();


/* Refresh every 60 seconds */

setInterval(
  loadMatches,
  60000
);

</script>

</body>
</html>
